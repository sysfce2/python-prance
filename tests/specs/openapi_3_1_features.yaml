# Exercises OpenAPI 3.1-only constructs (invalid under 3.0):
# - jsonSchemaDialect
# - license.identifier (SPDX)
# - webhooks
# - type arrays including null (replaces nullable)
# - exclusiveMinimum as a number (JSON Schema 2020-12)
# - $ref siblings
# - components.pathItems
openapi: "3.1.0"
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: OpenAPI 3.1 features
  version: "1.0.0"
  license:
    name: MIT
    identifier: MIT
paths:
  /items:
    get:
      operationId: listItems
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
webhooks:
  itemUpdated:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
components:
  schemas:
    Item:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: [string, "null"]
        score:
          type: number
          exclusiveMinimum: 0
    ItemRefWithSiblings:
      $ref: "#/components/schemas/Item"
      description: An item reference with sibling description
  pathItems:
    Health:
      get:
        operationId: health
        responses:
          "200":
            description: ok
