[tox]
envlist = py3{10,11,12,13,14}-{default,flex,no_icu,no_osv_or_icu},docs
minver=3.10
isolated_build=true

[testenv]
# Different dependencies for different test environments
groups = dev
extras =
  default: ssv,osv,icu,cli
  no_icu: ssv,osv,cli
  no_osv_or_icu: ssv,cli
  flex: flex,icu
# We need to set environment variables for py3 to work with click
setenv =
  LC_ALL=C.UTF-8
  LANG=C.UTF-8
# For Python 3.7 (main dev version), also run flake8 and sphinx
commands =
  pytest {posargs}
[testenv:docs]
groups = dev
commands =
  sphinx-build -b html \
    -d docs/build/doctrees \
    docs/source docs/build/html
